[workspace]
members = ["crates/moonshine-core", "crates/moonshine-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["vante"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.8"
dirs = "5"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = "2"
tar = "0.4"
flate2 = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
